services:
  app:
    build:
      context: .
      target: development
    container_name: taria-health-app-local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: taria_health_local
      DB_USER: taria_user
      DB_PASSWORD: taria_secret
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - next_cache:/app/.next
    working_dir: /app

  db:
    image: mysql:8.0
    container_name: taria-health-mysql-local
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: taria_health_local
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_USER: taria_user
      MYSQL_PASSWORD: taria_secret
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./localhost.sql:/docker-entrypoint-initdb.d/01-localhost.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: taria-health-phpmyadmin-local
    restart: unless-stopped
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root_secret
      UPLOAD_LIMIT: 64M
    ports:
      - "8083:80"

volumes:
  app_node_modules:
  next_cache:
  mysql_data:
